<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniChat</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <h1>OmniChat</h1>
    <span class="conn" id="conn">connecting…</span>
  </header>
  <div id="messages"></div>
  <form id="composer">
    <textarea id="input" rows="1" placeholder="Message the cluster…  (Enter to send, Shift+Enter for newline)"></textarea>
    <button class="send" id="send" type="submit">Send</button>
  </form>
</main>
<aside>
  <section class="failover">
    <h2>Last failover</h2>
    <div id="failover"></div>
  </section>
  <section>
    <h2>Cluster</h2>
    <div class="nodes" id="nodes"></div>
    <p class="hint" id="cluster-hint">Click a node to send through it. <b>Kill</b> stops that process like <code>kill -9</code>.</p>
  </section>
  <section>
    <h2>Replicated log</h2>
    <table class="log" id="log"></table>
  </section>
  <section>
    <h2>Events</h2>
    <ul class="events" id="events"></ul>
  </section>
</aside>

<script src="app.js"></script>
</body>
</html>
